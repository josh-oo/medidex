name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted
    env:
      EMBEDDING_MODEL_PATH: ${{ vars.EMBEDDING_MODEL_PATH }}
      EMBEDDING_MODEL_REVISION: ${{ vars.EMBEDDING_MODEL_REVISION }}
      EMBEDDING_MODEL_DTYPE: ${{ vars.EMBEDDING_MODEL_DTYPE }}
      EMBEDDING_MODEL_TOKENIZER_PATH: ${{ vars.EMBEDDING_MODEL_TOKENIZER_PATH }}
      EMBEDDING_MODEL_TOKENIZER_REVISION: ${{ vars.EMBEDDING_MODEL_TOKENIZER_REVISION }}
      EMBEDDING_MODEL_ASPECTS: ${{ vars.EMBEDDING_MODEL_ASPECTS }}
      EMBEDDING_MODEL_DIM: ${{ vars.EMBEDDING_MODEL_DIM }}
      EMBEDDING_MODEL_MAX_INPUT_LENGTH: ${{ vars.EMBEDDING_MODEL_MAX_INPUT_LENGTH }}
      EMBEDDING_SERVICE_HOST: ${{ vars.EMBEDDING_SERVICE_HOST }}
      EMBEDDING_SERVICE_PORT: ${{ vars.EMBEDDING_SERVICE_PORT }}
      VECTORSTORE_SERVICE_HOST: ${{ vars.VECTORSTORE_SERVICE_HOST }}
      VECTORSTORE_SERVICE_PORT: ${{ vars.VECTORSTORE_SERVICE_PORT }}
      VECTORSTORE_COLLECTION_NAME: ${{ vars.VECTORSTORE_COLLECTION_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      BACKEND_API_URL: http://logic:8002
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      DEBUG: "FALSE"
      DOCKER_CONFIG: /home/oehms/docker-config

    steps:
      - name: Ensure Docker config dir exists
        run: |
          mkdir -p $DOCKER_CONFIG

      - name: Update production code
        run: |
          cd ~/meerkat-tool
          git fetch origin
          git checkout prod
          git pull origin prod

      - name: Rebuild and deploy application
        run: |
          cd ~/meerkat-tool
          docker compose up -d --build

      - name: Run performance checks in Docker
        shell: bash
        run: |
          set -o pipefail
          
          cd ~/meerkat-tool/backend/tools
          
          # Build a temporary test container
          sudo docker build -t meerkat-tool-test . 
          
          # Run the performance check script inside the container
          docker run --rm \
            --network internal_net \
            -e BACKEND_API_URL=http://logic:8002 \
            -e BACKEND_API_KEY="${{ secrets.BACKEND_API_KEY }}" \
            meerkat-tool-test \
            python evaluate_backend.py --ci --no-progress | tee test_results.txt
          
          # Add results to GitHub Step Summary
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Rollback on failure
        if: failure()
        run: |
          cd ~/meerkat-tool
          echo "Performance checks failed. Rolling back..."
          git checkout HEAD~1
          docker compose up -d --build

      - name: Cleanup Docker test image
        if: always()
        run: |
          docker image rm meerkat-tool-test || true