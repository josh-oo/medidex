name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update production code
        run: |
          cd ~/meerkat-tool
          git fetch origin
          git checkout prod
          git pull origin prod

      - name: Rebuild and deploy
        run: |
          cd ~/meerkat-tool
          sudo docker compose up -d --build