name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update production code
        run: |
          cd ~/meerkat-tool
          git fetch origin
          git checkout prod
          git pull origin prod

      - name: Rebuild and deploy application
        run: |
          cd ~/meerkat-tool
          sudo docker compose up -d --build
        env:
          EMBEDDING_MODEL_PATH: ${{ secrets.EMBEDDING_MODEL_PATH }}
          EMBEDDING_MODEL_REVISION: ${{ secrets.EMBEDDING_MODEL_REVISION }}
          EMBEDDING_MODEL_DTYPE: ${{ secrets.EMBEDDING_MODEL_DTYPE }}
          EMBEDDING_MODEL_TOKENIZER_PATH: ${{ secrets.EMBEDDING_MODEL_TOKENIZER_PATH }}
          EMBEDDING_MODEL_TOKENIZER_REVISION: ${{ secrets.EMBEDDING_MODEL_TOKENIZER_REVISION }}
          EMBEDDING_MODEL_ASPECTS: ${{ secrets.EMBEDDING_MODEL_ASPECTS }}
          EMBEDDING_MODEL_DIM: ${{ secrets.EMBEDDING_MODEL_DIM }}
          EMBEDDING_MODEL_MAX_INPUT_LENGTH: ${{ secrets.EMBEDDING_MODEL_MAX_INPUT_LENGTH }}    
          EMBEDDING_SERIVE_HOST: ${{ secrets.EMBEDDING_SERIVE_HOST }}
          EMBEDDING_SERVICE_PORT: ${{ secrets.EMBEDDING_SERVICE_PORT }}
          VECTORSTORE_SERVICE_HOST: ${{ secrets.VECTORSTORE_SERVICE_HOST }}
          VECTORSTORE_SERVICE_PORT: ${{ secrets.VECTORSTORE_SERVICE_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BACKEND_API_URL=http://logic:8002
          DEBUG: FALSE

      - name: Run performance checks in Docker
        shell: bash
        run: |
          set -o pipefail
          
          cd ~/meerkat-tool/backend/tools
          
          # Build a temporary test container
          sudo docker build -t meerkat-tool-test . 
          
          # Run the performance check script inside the container
          sudo docker run --rm \
            --network internal_net \
            meerkat-tool-test \
            python evaluate_backend.py --ci --no-progress | tee test_results.txt
          
          # Add results to GitHub Step Summary
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Rollback on failure
        if: failure()
        run: |
          cd ~/meerkat-tool
          echo "Performance checks failed. Rolling back..."
          git checkout HEAD~1
          sudo docker compose up -d --build
          exit 1

      - name: Cleanup Docker test image
        if: always()
        run: |
          sudo docker image rm meerkat-tool-test || true
