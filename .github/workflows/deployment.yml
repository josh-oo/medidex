name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update production code
        run: |
          cd ~/meerkat-tool
          git fetch origin
          git checkout prod
          git pull origin prod

      - name: Rebuild and deploy
        run: |
          cd ~/meerkat-tool
          sudo docker compose up -d --build

      - name: Setup Python environment for tests
        run: |
          cd ~/meerkat-tool/backend/tools
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run performance checks
        run: |
          cd ~/meerkat-tool/backend/tools
          source .venv/bin/activate
          python scripts/evaluate_backend.py --ci | tee test_results.txt
          
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Rollback on failure
        if: failure()
        run: |
          cd ~/meerkat-tool
          echo "Performance checks failed. Rolling back..."
          git checkout HEAD~1
          sudo docker compose up -d --build
          exit 1

      - name: Cleanup Python environment
        if: always()
        run: |
          cd ~/meerkat-tool/backend/tools
          rm -rf .venv