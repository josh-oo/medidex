# The categories of the eligibility criteria of the study databases.
#
# A criterion of a database (study_database.eligibility_criteria) is a text in one of these categories, to include or to
# exclude a report. The dialogs of the databases (GET /eligibility-schema) derive from this file: a new category is a new
# entry here, no code.
#
# Keys of a category:
#   label         Name in the dialogs and wherever a criterion is shown.
#   description   What a criterion of the category is about (help text of the dialogs).
#
# The order of the entries is the order the categories are shown in.

categories:
  population:
    label: Population
    description: Who the participants must be (diagnosis, high-risk groups, age), and whether a mixed sample counts.

  design:
    label: Design
    description: The design the study must have (randomisation, control, the parent trial of a secondary publication).

  intervention:
    label: Intervention
    description: What the arms must receive or compare.

  outcome:
    label: Outcome
    description: What the study must measure.

  setting:
    label: Setting
    description: Where or for how long the study must take place.

  other:
    label: Other
    description: Anything that fits no other category.
