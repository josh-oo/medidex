# What a study consists of, and how it is presented. This is the single source of truth for the
# study details view (served as GET /study-schema), the study DTOs, the tag endpoints, the tag and study search.
#
# A study has four kinds of data:
#   fields      Primitive values of the study itself (numbers, a status, free text).
#   categories  Lists of tags (interventions, conditions, countries, ...).
#   graph       What the study says beyond that, as a graph: nodes (e.g. the arms of the study, each with its
#               interventions, dosage and duration) connected by relations (e.g. the comparisons of arms).
#   meta        Metadata of the database record (when it was entered and edited).
#
# Colors are names the frontend draws: blue, emerald, rose, amber, slate, sky, violet, teal.
# Icons are names of lucide icons (https://lucide.dev/icons), in kebab-case, that the frontend
# knows (src/lib/icons.ts); an unknown name is drawn as a generic tag icon.

# Primitive values. The key is the name of the field in the study DTO.
#   label    Name shown to the user.
#   type     integer | duration | enum | text
#   column   The attribute of the study in the database (src/database/models.py).
#   required The value must be given when a study is created (an enum field always is).
#   values   The allowed values of an `enum` field (required for those, and only for those). Creating a
#            study with another value is rejected.
#   display  metric (a tile at the top of the details) | text (a paragraph below the tiles) | none (not shown)
#   derive   An integer or duration field can be calculated from the graph while the study has no value of its own
#            (so a value given for the study wins, e.g. when a report only states the total):
#              source          the kind of entity to start at, e.g. arm
#              path            the relations to follow from there, ending at values, e.g. [participated, size]: the size
#                              of the population that took part in each arm
#              aggregate       sum (only if every entity of `source` has a value) | max | min
fields:
  shortName:
    label: Name
    type: text
    icon: tag
    color: slate
    display: none
    column: short_name
    required: true
  trialId:
    label: Trial ID
    type: text
    icon: tag
    color: slate
    display: none
    column: trial_registration_id
  numberParticipants:
    label: Participants
    type: integer
    icon: users
    color: blue
    display: metric
    column: number_participants
    derive: { source: arm, path: [participated, size], aggregate: sum }
  duration:
    label: Duration
    type: duration
    icon: clock
    color: emerald
    display: metric
    column: duration
    derive: { source: arm, path: [duration], aggregate: max }
  status:
    label: Status
    type: enum
    values: [Closed, Stopped early, Open/Ongoing, Planned]
    icon: flag
    color: amber
    display: metric
    column: status

# Units of durations ("12 weeks"), largest first. A duration is written in the largest unit that divides it evenly.
duration_units:
  - { name: year, seconds: 31536000 }
  - { name: month, seconds: 2592000 }
  - { name: week, seconds: 604800 }
  - { name: day, seconds: 86400 }
  - { name: hour, seconds: 3600 }

# Graph. What a study says beyond its own fields and tags, as entities and the relations between them. An entity has no
# properties, only relations to other entities: an arm (an intervention as it is delivered) receives interventions, is
# given at a dosage and for a duration, and is compared with other arms; a population (a group of participants) has a
# size, a sex, an age and conditions, and participated in the study as a whole or in an arm. Dosage, duration, size and
# so on are entities too, namely values: one entity per distinct value, however many arms have it. A study has any
# number of arms, and any two of them can be compared. The graph is the same for every study; a study keeps its own as
# JSON in its `graph` column (see src/utils/graph.py).
#
#   text_column  Column of the study with the plain text of studies from before the graph (shown as it is).
#
# entities: the kinds of entity, by name.
#   label, icon, color   How the entity is drawn.
#   description          What the entity is (API documentation).
#   root                 The study itself. Its data are the fields and categories above, so it has nothing here; it is there
#                        so that relations can start at the study as a whole (its id in the graph is `study`).
#   value                The entity is a value: a tag of a `category`, or a primitive of a `type` (text | integer | duration
#                        | enum, an enum with its `values`). It has no relations of its own.
#
# relations: the kinds of relation between entities, by name (they share their names with the fields and categories).
#   description          What the relation says (API documentation).
#   source, target       The kinds of entity it connects: one kind, or a list of the kinds an edge can start (or end) at.
#                        A relation that leads to values is an attribute of its source (the dosage of an arm).
#   many                 An entity can have several (an arm several interventions); otherwise one at most.
#   required             Identifies the source: an extracted entity without it (an arm without interventions) is left out.
#   line                 An attribute is part of its source when that is shown as a line ("Drug A + Drug B (10 mg, 5 weeks)").
#   symmetric            Source and target are interchangeable (A vs B is B vs A); used to compare studies.
#   separator            Between source and target when the edge is shown as a line ("Drug A vs Placebo").
#   card                 Also shown as a line on the study cards.
graph:
  text_column: comparison
  entities:
    study:
      label: Study
      icon: file-text
      color: slate
      description: The study as a whole.
      root: true
    arm:
      label: Arm
      icon: pill
      color: emerald
      description: An intervention as it is delivered to a group of participants. The control arm of a study is an arm too.
    population:
      label: Population
      icon: users
      color: sky
      description: A group of participants, of the whole study or of an arm.
    intervention:
      label: Intervention
      icon: syringe
      color: emerald
      description: An intervention, as a tag of the vocabulary.
      value: { category: interventions }
    role:
      label: Arm type
      icon: flag
      color: slate
      description: What an arm is in the study, the evaluated intervention or the control (placebo, sham, usual care, no treatment).
      value: { type: enum, values: [intervention, control, other] }
    dosage:
      label: Dosage
      icon: pill
      color: emerald
      description: The dose of an intervention, e.g. 10 mg.
      value: { type: text }
    frequency:
      label: Frequency
      icon: timer
      color: emerald
      description: How often an intervention is given, e.g. twice daily.
      value: { type: text }
    route:
      label: Route
      icon: syringe
      color: emerald
      description: How an intervention is given, e.g. oral or injection.
      value: { type: text }
    duration:
      label: Duration
      icon: clock
      color: emerald
      description: How long an intervention is given, e.g. 12 weeks.
      value: { type: duration }
    size:
      label: Participants
      icon: users
      color: sky
      description: The number of participants of a population.
      value: { type: integer }
    sex:
      label: Sex
      icon: user
      color: sky
      value: { type: enum, values: [female, male, mixed] }
    age:
      label: Age
      icon: baby
      color: sky
      description: The age of a population, e.g. 18-65 years.
      value: { type: text }
    condition:
      label: Condition
      icon: stethoscope
      color: blue
      description: A health condition of a population, as a tag of the vocabulary.
      value: { category: conditions }
    outcome:
      label: Outcome
      icon: target
      color: rose
      description: An outcome measure of the study, as a tag of the vocabulary.
      value: { category: outcomes }
  relations:
    comparison:
      label: Comparison
      icon: scale
      color: violet
      description: Two arms that the study compares ("Drug A vs Placebo"). An arm that takes part in several comparisons is one entity.
      source: arm
      target: arm
      symmetric: true
      many: true
      separator: " vs "
      card: true
    participated:
      label: Participants
      icon: users
      color: sky
      description: The population that took part in the study as a whole, or in one of its arms.
      source: [study, arm]
      target: population
      separator: ": "
    interventions:
      label: Interventions
      icon: syringe
      color: emerald
      description: What an arm receives.
      source: arm
      target: intervention
      many: true
      required: true
    role:
      label: Arm type
      icon: flag
      color: slate
      description: Whether the arm gets the evaluated intervention, is a control, or is something else.
      source: arm
      target: role
      line: false
    dosage:
      label: Dosage
      icon: pill
      color: emerald
      source: arm
      target: dosage
    frequency:
      label: Frequency
      icon: timer
      color: emerald
      source: arm
      target: frequency
    route:
      label: Route
      icon: syringe
      color: emerald
      source: arm
      target: route
    duration:
      label: Duration
      icon: clock
      color: emerald
      source: arm
      target: duration
    size:
      label: Participants
      icon: users
      color: sky
      description: The number of participants (enrolled, analysed or, for a study not yet carried out, planned).
      source: population
      target: size
    sex:
      label: Sex
      icon: user
      color: sky
      source: population
      target: sex
    age:
      label: Age
      icon: baby
      color: sky
      source: population
      target: age
    conditions:
      label: Conditions
      icon: stethoscope
      color: blue
      source: population
      target: condition
      many: true
    outcomes:
      label: Outcomes
      icon: target
      color: rose
      description: The outcomes (endpoints) the study names, primary or secondary alike. They are outcomes of the study (the tags of `outcomes`) too.
      source: study
      target: outcome
      many: true

# Database metadata. The key is the name of the field of the study.
meta:
  createdAt:
    label: Entered
    type: date
  updatedAt:
    label: Edited
    type: date

# Tag categories. They name the tag lists of the database, the categories of the tag search and the
# fields of the advanced study search; the REST endpoints (/<category> and /studies/{id}/<category>) are
# generated from them. The tags of every category are embedded, so similar and related tags can be searched
# for all of them, and every endpoint answers with the same {id, keyword} tags.
#
# Every category needs a storage entry in src/database/tagstorage.py (the tables or the column its tags
# live in); the application stops at startup if one is missing.
#
#   label             Plural name for display.
#   icon, color       How the category is drawn.
#   search_field      Singular name of the field in the advanced study search (e.g. `intervention==Placebo`).
#   description       What the tags are, with examples. Used in the API documentation.
#   free_text_search  The plain-text study search also matches the tags of this category (default false).
#   inline            The tags are kept in the column of the study with this name, separated by `//`, instead of
#                     a table of their own (default false).
categories:
  interventions:
    label: Interventions
    icon: syringe
    color: emerald
    search_field: intervention
    description: "Interventions of a study (e.g. 'Placebo', 'Group Therapy', ...)"
    free_text_search: true
  conditions:
    label: Conditions
    icon: stethoscope
    color: blue
    search_field: condition
    description: "Health conditions of the participants of a study (e.g. 'COVID-19', 'Diabetes', ...)"
  outcomes:
    label: Outcomes
    icon: target
    color: rose
    search_field: outcome
    description: "Outcomes of a study (e.g. 'Mortality', 'Quality of Life', ...)"
  participants:
    label: Participants
    icon: users
    color: sky
    search_field: participant
    description: "Participant attributes of a study (e.g. Male, Female, Adult, Child, ...)"
  design:
    label: Study Design
    icon: activity
    color: teal
    search_field: design
    description: "Design of a study (e.g. 'Randomized Controlled Trial', 'Controlled Clinical Trial')"
  countries:
    label: Countries
    icon: map-pin
    color: amber
    search_field: country
    inline: true
    description: "Countries where a study takes place"
