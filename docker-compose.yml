services:
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.16.1
    container_name: docling
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
    expose:
      - 5001
    networks:
      - internal_net

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
      # Any .sql / .sh placed here runs once, on first start of an empty data volume.
      - ./backend/postgres-init:/docker-entrypoint-initdb.d
      - ${POSTGRES_BACKUPS:-./backend/_data/postgres-backups}:/backups
    expose:
      - 5432
    ports:
      - "5432:5432"
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - 6379
    networks:
      - internal_net

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.17.1-unprivileged
    restart: always
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - ./backend/_data/qdrant:/qdrant/storage
      # Uncomment if you want a custom config file:
      # - ./backend/_data/qdrant_config/production.yaml:/qdrant/config/production.yaml
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - internal_net

  # One-shot: prepares both qdrant collection and logic data volume, then exits.
  # Runs before `logic` starts. Idempotent: safe to run multiple times.
  app-init:
    container_name: app-init
    build:
      context: ./backend
      dockerfile: app-init/Dockerfile
    restart: "no"
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://${VECTORSTORE_SERVICE_HOST:-qdrant}:6333
      - VECTORSTORE_COLLECTION_NAME=${VECTORSTORE_COLLECTION_NAME:-report_embeddings_medidex}
      - EMBEDDING_MODEL_DIM=${EMBEDDING_MODEL_DIM:-1024}
      - DATABASE_VOLUME=/data
    volumes:
      - ./backend/_data/qdrant:/qdrant/storage
      - ./backend/_data/backend:/data
    networks:
      - internal_net

  embedding:
    container_name: embedding
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
    command: >
      --model-id ${EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      --revision ${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      --max-batch-tokens ${EMBEDDING_MAX_BATCH_TOKENS:-2048}
    environment:
      # Only needed for gated/private models. Left unset unless defined in .env.
      - HF_TOKEN
    ports:
      - "8080:80"
    volumes:
      - ./backend/_data/embeddings:/data
    pull_policy: always
    networks:
      - internal_net

  logic:
    container_name: logic
    build:
      context: ./backend
      dockerfile: logic/Dockerfile
    ports:
      - "8002:8002"
    depends_on:
      app-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/_data/backend:/data
    read_only: true
    networks:
      - internal_net
    tmpfs:
      - /tmp
      - /var/tmp
    environment:
      - DATABASE_VOLUME=/data
      - EMBEDDING_MODEL_BASE_URL=${EMBEDDING_MODEL_BASE_URL:-http://embedding:80/v1}
      - EMBEDDING_MODEL_API_KEY=${EMBEDDING_MODEL_API_KEY:-unused}
      - VECTORSTORE_SERVICE_HOST=${VECTORSTORE_SERVICE_HOST:-qdrant}
      - VECTORSTORE_SERVICE_PORT=${VECTORSTORE_SERVICE_PORT:-6334}
      - VECTORSTORE_COLLECTION_NAME=${VECTORSTORE_COLLECTION_NAME:-report_embeddings_medidex}
      - JWT_SECRET=${JWT_SECRET}
      - JWKS_URL=http://frontend:3000/api/auth/jwks
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB_RESOURCES=${POSTGRES_DB_RESOURCES:-meerkat}
      - POSTGRES_DB_USERS=${POSTGRES_DB_USERS:-users}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DOCLING_URL=${DOCLING_URL:-http://docling:5001}
      - DEBUG=${DEBUG:-false}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - STAGE=${STAGE:-local}
      - MEERKAT_API_URL=${BACKEND_API_URL:-http://logic:8002/backend}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB_FRONTEND:-medidex}?schema=public
      - INACTIVITY_DIALOG=${INACTIVITY_DIALOG:-false}
    networks:
      - internal_net
      #- public_net

networks:
  internal_net:
    driver: bridge
  #public_net:
  #  external: true

volumes:
  postgres_data:
