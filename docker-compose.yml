version: '3.8'

services:
  embedding:
    container_name: embedding
    build:
      context: ./backend
      dockerfile: embedding/Dockerfile
    expose:
      - 50051
    read_only: true
    networks:
      - internal_net

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    restart: always
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - ./backend/_data/qdrant:/qdrant/storage
      # Uncomment if you want a custom config file:
      # - ./backend/_data/qdrant_config/production.yaml:/qdrant/config/production.yaml
    networks:
      - internal_net

  logic:
    container_name: logic
    build:
      context: ./backend
      dockerfile: logic/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./backend/_data/backend:/data
    read_only: true
    networks:
      - internal_net
    tmpfs:
      - /tmp
      - /var/tmp

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    expose:
      - 8501
    read_only: true
    networks:
      - public_net
      - internal_net
    user: appuser
    volumes:
      - /home/appuser/.streamlit
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  internal_net:
    external: true
  public_net:
    external: true

