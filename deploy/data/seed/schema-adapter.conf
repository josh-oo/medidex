# Read by ops/app-init/init.sh on every app-init run.
#
# Whether to apply views.sql, the compatibility layer that adapts a physical
# resources schema using different table/column names (e.g. a Cochrane-style
# CRG/CENTRAL database) onto the generic snake_case schema the application
# expects (app/backend/src/database/models.py).
#
# Leave this "false" for the bundled synthetic_seed.sql demo data -- it
# already creates its tables directly under the schema the application
# expects, so no adapter is needed. Only set it to "true" if the resources
# database is pointed at a real physical schema that still uses its own
# naming; see views.sql for what it expects and adjust it to match first.
APPLY_SCHEMA_VIEWS=false
